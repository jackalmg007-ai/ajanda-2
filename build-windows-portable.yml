name: Windows taşınabilir sürüm oluştur

# Bu iş akışı, GERÇEK bir Windows makinesinde (GitHub'ın ücretsiz "windows-latest"
# çalıştırıcısında) uygulamayı derler. Yerel bilgisayarınızda Rust/Visual Studio
# kurmanıza GEREK YOKTUR — her şey GitHub'ın sunucusunda olur, siz sadece sonucu
# indirirsiniz.
#
# Ürettiği .exe, WebView2 çalışma zamanının TAMAMINI kendi içinde taşır
# ("fixedRuntime" modu). Bu sayede hedef bilgisayarda WebView2 kurulu olmasa
# bile, internete bağlanmadan çalışır. Kurulum "currentUser" modunda olduğu
# için yönetici izni gerekmez ve birkaç saniyede tamamlanır.
#
# Çalıştırmak için:
#   1. Bu projeyi bir GitHub deposuna yükleyin (push edin).
#   2. GitHub'da "Actions" sekmesine gidin, bu iş akışını seçip "Run workflow"a basın
#      (ya da main dalına her push yaptığınızda otomatik çalışır).
#   3. İş bitince "Summary" sayfasındaki "ajanda-windows-portable" dosyasını indirin.

"on":
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo önbelleği
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm bağımlılıklarını kur
        run: npm install

      - name: Uygulama ikonlarını üret
        run: npx tauri icon app-icon.png

      # WebView2 "Fixed Version" çalışma zamanını edinir. Microsoft bunu yalnızca
      # manuel bir indirme sayfasında (kalıcı/sürüme özel bağlantı olmadan) sunduğu
      # için, topluluk tarafından paketlenmiş resmi-olmayan ama yaygın kullanılan
      # bir NuGet paketinden alıyoruz. Bu adım başarısız olursa, README'deki
      # "Plan B: manuel indirme" bölümüne bakın.
      - name: WebView2 sabit sürüm çalışma zamanını indir
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "src-tauri/webview2runtime"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $nupkg = "$env:RUNNER_TEMP\webview2runtime.nupkg.zip"

          Write-Host "NuGet paketi indiriliyor..."
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/WebView2.Runtime.X64" -OutFile $nupkg

          $extractDir = "$env:RUNNER_TEMP\webview2extract"
          Expand-Archive -Path $nupkg -DestinationPath $extractDir -Force

          $exe = Get-ChildItem -Path $extractDir -Recurse -Filter "msedgewebview2.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "msedgewebview2.exe paket içinde bulunamadı. README'deki 'Plan B: manuel WebView2 indirme' bölümünü izleyin."
            exit 1
          }
          Write-Host "Bulundu: $($exe.Directory.FullName)"
          Copy-Item -Path "$($exe.Directory.FullName)\*" -Destination $dest -Recurse -Force

          if (-not (Test-Path "$dest\msedgewebview2.exe")) {
            Write-Error "Kopyalama sonrası msedgewebview2.exe hedefte bulunamadı."
            exit 1
          }
          Write-Host "WebView2 sabit çalışma zamanı hazır: $dest"

      - name: Uygulamayı derle (NSIS, currentUser, fixedRuntime)
        run: npm run build -- --bundles nsis

      - name: Taşınabilir klasörü hazırla (kurulumsuz, deneysel)
        shell: pwsh
        run: |
          $portable = "portable-deneysel/Ajanda"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "src-tauri/target/release/ajanda.exe" -Destination $portable
          Copy-Item "src-tauri/webview2runtime" -Destination "$portable/webview2runtime" -Recurse
          Write-Host "NOT: Bu klasör deneyseldir; kurulum yapmadan doğrudan çalışıp çalışmadığı doğrulanmamıştır."
          Write-Host "Garantili sonuç için 'setup.exe' kurulumunu kullanın (aşağıda ayrı olarak yüklenir)."

      - name: Kurulum dosyasını (setup.exe) yükle
        uses: actions/upload-artifact@v4
        with:
          name: ajanda-windows-kurulum
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Deneysel taşınabilir klasörü yükle
        uses: actions/upload-artifact@v4
        with:
          name: ajanda-windows-portable-deneysel
          path: portable-deneysel/
          if-no-files-found: error
