[package]
name = "ajanda"
version = "1.0.0"
description = "Ajanda — Kişisel Planlayıcı (deri ciltli defter görünümünde masaüstü ajanda)"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ajanda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
lto = "thin"
opt-level = "s"
strip = true
